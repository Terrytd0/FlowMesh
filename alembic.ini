# Alembic configuration for FlowMesh.
#
# Two deliberate departures from the generated default:
#
# 1. `script_location = alembic` is relative to this file rather than to the
#    current working directory. Alembic resolves relative paths against the CWD,
#    so `alembic upgrade head` from a different directory -- a cron job, a CI step
#    with `working-directory` set, a container entrypoint that `cd`s first -- looks
#    for `./alembic/versions` and reports "No 'script_location' key found in
#    configuration" style failures that say nothing about the cause. An absolute
#    path computed once here removes the working directory from the question.
#
# 2. `prepend_sys_path = .` rather than `src`. The migration imports the models
#    (below), and the models import `backend.*`. The repo root is therefore the
#    only directory that makes `import backend` work, and this is how it is put on
#    the path.
#
# The database URL is deliberately *not* set here. It is read from
# `Settings.effective_database_url_sync` in `alembic/env.py`, so there is exactly
# one place a database DSN is configured -- `backend/config/settings.py` -- and
# setting `sqlalchemy.url` here as well would create a second one that silently
# wins for anyone who edits only this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s

# No `timezone = UTC` here. It looks harmless and is not: alembic resolves it
# through the platform's timezone database, and a Windows host with no tzdata
# installed fails every command with "Can't locate timezone: UTC" -- including
# `alembic history`, so the migration history is unreadable on the machine that
# most needs to read it. Revision filenames use `%(year)d`-style local fields; a
# UTC-stamped name is worth less than a command that runs everywhere, and all
# timestamps that matter are stored in the database as UTC.

# Timestamped, descriptive revision filenames rather than bare hashes. During an
# incident the migration order is read by hand far more often than you would expect,
# and "20261001-0912-add-reservation-expiry-index" needs no cross-reference to be
# placed correctly in a sequence. `alembic history` stays readable, which is the
# entire point of the choice.

# No `post_write_hooks` ruff step, deliberately. It was here first and it was
# removed: alembic resolves a `console_scripts` hook through installed distribution
# entry points, and the ruff wheel registers no `ruff` entry point, so every
# autogenerated revision failed *after* writing a perfectly good file, with
# "Could not find entrypoint console_scripts.ruff". Formatting is not lost by
# dropping it -- `ruff format --check .` runs in `make check` and in CI, so an
# unformatted migration fails the build rather than being auto-fixed invisibly.

# ---------------------------------------------------------------------------
# Logging for alembic itself. Required, not optional: `env.py` calls
# `fileConfig(config.config_file_name)`, and that call raises KeyError on a config
# with no `[formatters]` section -- so omitting this block makes *every* alembic
# command fail at startup with an error that names nothing FlowMesh owns.
#
# WARN and above by default. `INFO` here prints a line per migration plus a full
# DDL echo, which buries the one line that matters when something fails.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
