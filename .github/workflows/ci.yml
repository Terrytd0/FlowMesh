name: CI

# FlowMesh. Three jobs, in dependency order, each cheap enough to run on every push.
#
# What runs where, and why:
#
#   quality    format + lint + types + the full suite. Everything else depends on it.
#   container  builds the image and proves the healthcheck works. Skipped on docs-only
#              changes, because an image build is the slowest thing here and a
#              dashboard edit does not change it.
#   evidence   a SHORT load test with the latency and correctness budgets enforced.
#              Deliberately not the full 500/sec run and not the chaos test: both are
#              timing-sensitive, and a red build from machine jitter trains people to
#              re-run until green. The short run asserts the same properties.
#
# The integration tests (real Postgres, Kafka, RabbitMQ, gRPC) run as service
# containers in the `quality` job, so `--ignore` is not needed and a red build means
# a real failure rather than a missing container.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch. A superseded run is cancelled rather than queued, because a
  # queue of three full suites means the last one starts ten minutes after the code
  # stopped changing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `uv`'s cache key is the lockfile; exporting it here means a dependency bump
  # invalidates the cache and a code-only change does not.
  UV_CACHE_DIR: ~/.cache/uv
  UV_PYTHON_INSTALL_DIR: ~/.local/share/uv/python
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowmesh
          POSTGRES_PASSWORD: flowmesh
          POSTGRES_DB: flowmesh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowmesh -d flowmesh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Ruff is pinned to the same floor as `pyproject.toml`, which documents why:
      # ruff 0.16 is where `ruff format` began formatting Python inside Markdown,
      # so below that `make check` and CI disagree about the same file.
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration -m integration
        env:
          FLOWMESH_DATABASE_URL: postgresql+asyncpg://flowmesh:flowmesh@localhost:5432/flowmesh_test

      - name: Alembic drift check
        # Autogenerate a revision into a temp file and fail if it is non-empty. A
        # model changed without a migration, and the next `make migrate` would
        # silently do nothing.
        run: |
          uv run alembic upgrade head
          uv run alembic check

  container:
    name: image builds and is healthy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A dashboard edit or a docs change does not change the image, and this is the
    # slowest job in the workflow.
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t flowmesh:ci .

      - name: Prove the healthcheck works
        # Not "the container starts" -- "the documented healthcheck command
        # succeeds", which is what compose actually depends on. A Dockerfile whose
        # HEALTHCHECK references a binary not in the final image starts fine and
        # fails every deploy.
        run: |
          docker run -d --name flowmesh-ci -p 8000:8000 flowmesh:ci
          for attempt in $(seq 1 30); do
            if docker exec flowmesh-ci curl -fsS http://localhost:8000/healthz; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          docker logs flowmesh-ci
          exit 1

      - name: The proto compiles
        # Regenerates into a scratch directory and fails if protoc errors. Catches a
        # `.proto` edit that the committed stubs were never regenerated for, which
        # otherwise only shows up as an import error in production.
        run: |
          uvx --from grpcio-tools==1.68.0 python -m grpc_tools.protoc \
            -I proto \
            --python_out=/tmp/proto-check \
            --grpc_python_out=/tmp/proto-check \
            proto/flowmesh/v1/fraud.proto

  evidence:
    name: load test budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # 150 orders/sec for 4s rather than 500 for 10s. The *rate* is lower because
      # a shared CI runner cannot generate 500/sec, and asserting a budget the runner
      # cannot meet produces a permanently red build.
      #
      # The budgets that still run are the ones that do not depend on the machine:
      # zero oversells and zero data loss. `min_throughput_per_sec` is raised to
      # match what the runner can actually do, and that substitution is visible in
      # the command below rather than buried in a config file.
      - name: Load test
        run: |
          uv run python -m backend.scripts.loadtest \
            --rate 150 --duration 4 \
            --report /tmp/loadtest-report.md \
            --json /tmp/loadtest.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            /tmp/loadtest-report.md
            /tmp/loadtest.json
          if-no-files-found: warn
          retention-days: 14

      # The chaos test asserts properties that are *not* timing-dependent -- zero
      # lost events, the replay actually happened, no duplicate writes -- so it runs
      # here in full. It is the job that would catch a regression in idempotency,
      # which is the single most valuable thing in this workflow.
      - name: Chaos test
        run: |
          uv run python -m backend.scripts.chaos_test \
            --stream 300 \
            --report /tmp/chaos-test.md \
            --json /tmp/chaos.json

      - name: Upload the chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: |
            /tmp/chaos-test.md
            /tmp/chaos.json
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: dashboard references real metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Separate from `quality` so a dashboard typo shows up as "dashboard typo"
      # rather than as a test-suite failure. The check itself is in
      # `tests/unit/observability/test_dashboards.py`; this job only runs it.
      - name: Dashboard metrics are consistent
        run: uv run pytest tests/unit/observability/test_dashboards.py -v